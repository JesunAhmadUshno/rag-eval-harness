name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: All tests (layout, no public grade, learn, build, deep, model judge with a fake embedder, real data)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: level 1 golden set run
        run: python level-1-learn/run_eval.py
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: Results regenerate unchanged from the evidence (Deep run, regression gate, ablation, transfer test, paired statistics, calibration)
        run: sh reproduce.sh
        env:
          PYTHON: python
