name: Deploy dashboard to GitHub Pages

# Builds the Lab OS live dashboard in site/ from the committed result files and publishes it
# at the repo root (https://jesunahmadushno.github.io/rag-eval-harness/). It replaces the
# earlier web/ results lab, which stays in the repo as source. The build runs
# site/src/rag.check.mjs first, so a port that stops reproducing the Python results fails here.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "level-1-learn/**"
      - "level-2-build/**"
      - "level-3-deep/**"
      - "real-data/*.json"
      - "model-metrics/*.json"
      - "web/src/metrics.js"
      - "tests/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
